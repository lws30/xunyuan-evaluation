name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m xunyuan_eval demo-v2 --output artifacts/demo
      - run: python -m xunyuan_eval score-challenge --run artifacts/demo/run.json --reference artifacts/demo/reference.json --video-reference artifacts/demo/video_reference.json --output artifacts/demo/report.json
      - run: python -m xunyuan_eval add-report-score --report artifacts/demo/report.json --score 0 --output artifacts/demo/final_report.json

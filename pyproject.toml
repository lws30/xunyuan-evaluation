[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xunyuan-evaluation"
version = "0.1.1"
description = "Public, offline self-evaluation tools for the Xunyuan S10 inspection challenge"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
xunyuan-eval = "xunyuan_eval.cli:main"

[tool.setuptools.packages.find]
include = ["xunyuan_eval*"]
